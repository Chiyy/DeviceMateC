<title>DeviceMate - 设备信息采集工具</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  max-width: 720px;
  width: 100%;
  overflow: hidden;
}
.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  padding: 28px 32px;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
}
.header .logo {
  width: 72px;
  height: 72px;
  margin-bottom: 12px;
  border-radius: 16px;
  background: #fff;
  padding: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}
.header .title {
  margin-left: 15px;
  height: 72px;
}
.header h1 { font-size: 24px; font-weight: 600; }
.header p { font-size: 13px; opacity: 0.85; margin-top: 6px; }
.content { padding: 24px 32px; }
.loading {
  text-align: center;
  padding: 60px 20px;
  color: #999;
}
.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #f0f0f0;
  border-top-color: #667eea;
  border-radius: 50%;
  margin: 0 auto 16px;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.info-list { display: flex; flex-direction: column; gap: 2px; }
.info-item {
  display: flex;
  padding: 14px 0;
  border-bottom: 1px solid #f0f0f0;
  align-items: flex-start;
  gap: 16px;
}
.info-item:last-child { border-bottom: none; }
.info-label {
  flex-shrink: 0;
  width: 140px;
  color: #888;
  font-size: 14px;
  line-height: 22px;
}
.info-value-wrap {
  flex: 1;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  min-width: 0;
}
.info-value {
  flex: 1;
  color: #333;
  font-size: 14px;
  line-height: 22px;
  word-break: break-all;
  font-family: "SF Mono", "Consolas", "Monaco", monospace;
}
.copy-btn {
  flex-shrink: 0;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  color: #aaa;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.copy-btn:hover { background: #f0f0ff; color: #667eea; }
.copy-btn:active { transform: scale(0.9); }
.copy-btn svg { width: 16px; height: 16px; }
.section-title {
  font-size: 15px;
  font-weight: 600;
  color: #333;
  margin: 20px 0 12px;
  padding-left: 10px;
  border-left: 3px solid #667eea;
}
.usb-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.usb-table th {
  background: #f8f8fc;
  color: #666;
  font-weight: 600;
  text-align: left;
  padding: 10px 12px;
  border-bottom: 2px solid #eee;
}
.usb-table td {
  padding: 10px 12px;
  border-bottom: 1px solid #f5f5f5;
  color: #333;
  line-height: 20px;
}
.usb-table tr:last-child td { border-bottom: none; }
.usb-table .col-serial { font-family: "SF Mono", "Consolas", "Monaco", monospace; }
.usb-table .col-action { width: 50px; text-align: center; }
.usb-empty {
  text-align: center;
  padding: 24px;
  color: #bbb;
  font-size: 13px;
  background: #fafafa;
  border-radius: 8px;
}
.footer {
  padding: 16px 32px 28px;
  text-align: center;
}
.copyright {
  margin-top: 50px;
  width: 100%;
  text-align: center;
  color: #b9b8bf;
  font-size: 12px;
}
.btn {
  display: inline-block;
  padding: 10px 32px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}
.btn:hover { opacity: 0.9; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-danger {
  background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
  margin-left: 12px;
}
.btn-danger:hover { opacity: 0.9; }
.btn-danger:active { transform: scale(0.98); }
.timestamp { margin-top: 12px; font-size: 12px; color: #bbb; }
/* Toast */
.toast {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(-80px);
  background: #333;
  color: #fff;
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 9999;
  opacity: 0;
  transition: all 0.3s ease;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  pointer-events: none;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
</style>
</head>

    <div class="title">
      <h1>DeviceMate</h1>
      <p>跨平台设备信息采集工具</p>
    </div>
  </div>
  <div class="content">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>正在采集硬件信息, 请稍候...</p>
    </div>
    <div id="result" style="display:none;">
      <div class="info-list" id="infoList"></div>
      <div id="usbSection"></div>
    </div>
  </div>
  <div class="footer">
    <button class="btn" id="refreshBtn" onclick="collect()" disabled>重新采集</button>
    <button class="btn btn-danger" id="closeBtn" onclick="closeApp()">关闭程序</button>
    <div class="timestamp" id="timestamp"></div>
  </div>
</div>

<div id="sudoModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:28px;max-width:400px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <h3 style="margin-bottom:16px;color:#2c3e50;">需要 Root 权限</h3>
    <p style="margin-bottom:12px;font-size:13px;color:#666;">检测到部分硬件信息（设备序列号、硬盘序列号等）需要 Root 权限才能获取，请输入 Root 密码以重新采集。密码仅保存在内存中。</p>
    <input type="password" id="sudoPassword" placeholder="Root 密码" style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:16px;box-sizing:border-box;" onkeydown="if(event.key==='Enter')submitSudo()"/>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn" onclick="hideSudoModal()" style="background:#95a5a6;">取消</button>
      <button class="btn" onclick="submitSudo()" style="background:#2c3e50;">确认并重新采集</button>
    </div>
  </div>
</div>
<div class="copyright">
  <p>Copyright © 2026 huangcy@jihualab.ac.cn</p>
</div>

<div class="toast" id="toast">已复制</div>
<script>
const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

const labels = {
  os_name: "操作系统类型",
  os_version: "操作系统信息",
  os_install_date: "操作系统安装日期",
  device_serial: "设备序列号",
  hdd_serials: "硬盘序列号",
  ip_addresses: "IP 地址",
  mac_addresses: "MAC 地址",
  // collect_time: "采集时间"
};

let lastData = null;
let sudoTried = false;

async function collect() {
  document.getElementById("loading").style.display = "block";
  document.getElementById("result").style.display = "none";
  document.getElementById("refreshBtn").disabled = true;
  try {
    const resp = await fetch("/api/collect");
    const data = await resp.json();
    lastData = data;
    renderInfo(data);
    renderUSB(data.usb_devices || []);
    document.getElementById("loading").style.display = "none";
    document.getElementById("result").style.display = "block";
    document.getElementById("refreshBtn").disabled = false;

    /* Linux 下检测到信息不完整且未尝试过 sudo, 自动弹窗请求密码 */
    if (!sudoTried && data.os_name === "linux") {
      if (data.device_serial === "未知" || data.hdd_serials === "未检测到") {
        sudoTried = true;
        showSudoModal();
      }
    }
  } catch (e) {
    document.getElementById("loading").innerHTML = '<p style="color:#e74c3c">采集失败: ' + e.message + "</p>";
  }
}

function renderInfo(data) {
  const list = document.getElementById("infoList");
  list.innerHTML = "";
  for (const key of Object.keys(labels)) {
    const val = data[key] || "—";
    const item = document.createElement("div");
    item.className = "info-item";
    item.innerHTML =
      '<div class="info-label">' + labels[key] + '</div>' +
      '<div class="info-value-wrap">' +
        '<div class="info-value">' + escapeHtml(val) + '</div>' +
        '<button class="copy-btn" onclick="copyText(this,\'' + val + '\')" title="复制">' + COPY_ICON + '</button>' +
      '</div>';
    list.appendChild(item);
  }
}

function renderUSB(devices) {
  const section = document.getElementById("usbSection");
  let html = '<div class="section-title">USB 存储设备</div>';
  if (!devices || devices.length === 0) {
    html += '<div class="usb-empty">未检测到 USB 存储设备</div>';
  } else {
    html += '<table class="usb-table"><thead><tr>' +
      '<th>设备名称 / 型号</th><th>序列号</th><th class="col-action">操作</th>' +
      '</tr></thead><tbody>';
    devices.forEach(function(d) {
      const name = escapeHtml(d.name || d.model || "USB 存储设备");
      const model = escapeHtml(d.model || d.name || "—");
      const serial = escapeHtml(d.serial || "—");
      html += '<tr>' +
        '<td>' + name + '</td>' +
        '<td class="col-serial">' + serial + '</td>' +
        '<td class="col-action"><button class="copy-btn" onclick="copyText(this,\'' + serial + '\')" title="复制">' + COPY_ICON + '</button></td>' +
        '</tr>';
    });
    html += '</tbody></table>';
  }
  section.innerHTML = html;
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(function() {
    showToast("已复制: " + (text.length > 40 ? text.substring(0, 40) + "..." : text));
  }).catch(function() {
    // 降级方案
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); showToast("已复制"); } catch(e) { showToast("复制失败"); }
    document.body.removeChild(ta);
  });
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.classList.remove("show"); }, 2000);
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function escAttr(s) {
  return JSON.stringify(s);
}

function showSudoModal() {
  document.getElementById("sudoModal").style.display = "flex";
  document.getElementById("sudoPassword").value = "";
  document.getElementById("sudoPassword").focus();
}

function hideSudoModal() {
  document.getElementById("sudoModal").style.display = "none";
}

async function submitSudo() {
  const pwd = document.getElementById("sudoPassword").value;
  if (!pwd) return;
  hideSudoModal();
  showToast("正在使用 Root 权限重新采集...");
  try {
    await fetch("/api/sudo", { method: "POST", body: pwd });
    await collect();
  } catch (e) {
    showToast("设置失败: " + e.message);
  }
}

function closeApp() {
  if (!confirm("确定要关闭 DeviceMate 吗?")) return;
  fetch("/api/shutdown").catch(function() {});
  showToast("程序已关闭");
  setTimeout(function() {
    window.close();
  }, 500);
}

window.onload = collect;
</script>
</body>
</html>
